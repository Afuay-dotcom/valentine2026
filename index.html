<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First's Heart Portal 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;600&display=swap');
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #ffeff6; /* ชมพูพาสเทล */
            text-align: center;
            padding: 50px;
            margin: 0;
            overflow: hidden; /* ห้ามเลื่อนหน้าจอ */
        }

        /* --- ส่วนเนื้อหา (อยู่หน้าสุด) --- */
        .container {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
            border: 3px solid #ff8fab;
            position: relative;
            z-index: 10; /* ให้กล่องลอยอยู่เหนือหัวใจ */
        }

        h1 { color: #d63384; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }

        .menu-btn {
            display: block;
            background: #ff8fab;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 1.2rem;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(255, 143, 171, 0.3);
        }

        .menu-btn:hover {
            background: #fb6f92;
            transform: scale(1.05);
        }

        /* --- ส่วน Animation หัวใจลอย (อยู่หลังสุด) --- */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* อยู่ข้างหลังเนื้อหา */
            pointer-events: none; /* กดทะลุได้ */
        }

        .heart {
            position: absolute;
            bottom: -50px; /* เริ่มต้นจากใต้จอ */
            width: 20px;
            height: 20px;
            background-color: rgba(255, 192, 203, 0.8);
            transform: rotate(45deg);
            animation: floatUp linear infinite;
        }

        /* วาดรูปหัวใจ */
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: inherit;
            border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: -50%; }

        /* Animation ลอยขึ้น */
        @keyframes floatUp {
            0% { transform: rotate(45deg) translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.8; } /* โผล่มาตอน 20% ของทาง */
            100% { transform: rotate(45deg) translateY(-120vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-animation" id="bgAnimation"></div>

    <div class="container">
        <h1>Welcome, Khun Nant! 🤍</h1>
        <p>ยินดีต้อนรับเข้าสู่โลกของเฟิสท์<br>กรุณาเลือกเมนูที่ต้องการ:</p>

        <a href="profile.html" class="menu-btn">📁 อ่านคู่มือการใช้งาน (Profile)</a>
        <a href="contract.html" class="menu-btn">✍️ สัญญาใจอะฮุฮิฮุฮิ (Click!)</a>
        <a href="gacha.html" class="menu-btn">🎁 เสี่ยงโชคสุ่มของขวัญ (Click!)</a>
    </div>

    <script>
        const bg = document.getElementById('bgAnimation');
        const heartCount = 25; // จำนวนหัวใจ (เพิ่มได้)

        // สีหัวใจหลายๆ เฉด (ชมพู, แดงอ่อน, ม่วงอ่อน)
        const colors = ['#ffb7c5', '#ffccd5', '#ff8fab', '#ffc2d1', '#e0b0ff'];

        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // 1. สุ่มตำแหน่งแนวนอน (0-100% ของจอ)
            heart.style.left = Math.random() * 100 + 'vw';
            
            // 2. สุ่มความเร็ว (ลอยช้า-เร็ว ไม่เท่ากัน)
            heart.style.animationDuration = Math.random() * 5 + 6 + 's'; 
            
            // 3. สุ่มเวลาเริ่ม (ไม่ให้ขึ้นพร้อมกัน)
            heart.style.animationDelay = Math.random() * 5 + 's';

            // 4. สุ่มสี
            heart.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            // 5. สุ่มขนาด (ใช้ zoom แทน transform เพื่อไม่ให้ตีกับ Animation)
            heart.style.zoom = Math.random() * 0.8 + 0.5; // ขนาด 0.5 ถึง 1.3 เท่า

            bg.appendChild(heart);
        }
    </script>

</body>
</html>
